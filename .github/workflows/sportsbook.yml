name: Private sportsbook verification
on:
  push:
    branches: [feature/private-virtual-sportsbook]
    paths: ['sportsbook_service/**', '.github/workflows/sportsbook.yml']
  pull_request:
    paths: ['sportsbook_service/**', '.github/workflows/sportsbook.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r sportsbook_service/requirements.txt
      - run: python -m pytest -q sportsbook_service --junitxml=/tmp/sportsbook-tests.xml
      - run: node --check sportsbook_service/app.js
      - run: npm install --no-save --package-lock=false playwright@1.61.1
      - run: npx playwright install --with-deps webkit
      - run: node sportsbook_service/test_mobile.cjs
        env:
          LH_SCREENSHOT: /tmp/sportsbook-mobile.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sportsbook-verification
          path: |
            /tmp/sportsbook-tests.xml
            /tmp/sportsbook-mobile.png
