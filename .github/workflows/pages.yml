name: Verify and deploy Lake House Picks
on:
  push:
    branches: [main]
    paths: ['index.html', 'visual.js', 'visual.css', 'analytics.js', 'analytics.css', 'charts.js', 'charts.css', 'research.js', 'research.css', 'intelligence.js', 'intelligence.css', 'verification.html', 'scoreboards.json', 'sportsbook-splits.json', 'public-trades.json', 'scripts/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Refresh public sports trades']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
concurrency:
  group: lake-house-verified-publish
  cancel-in-progress: false
jobs:
  verify-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false jsdom@26 playwright@1.61.1
      - run: npx playwright install --with-deps webkit
      - run: python scripts/test_collectors.py && python scripts/test_source_enrichment.py && python scripts/test_publish.py && python scripts/test_data_integrity.py && python scripts/test_splits.py
      - run: |
          for source in visual.js analytics.js charts.js research.js intelligence.js; do node --check "$source"; done
          node scripts/test_visual.cjs
          node scripts/test_analytics.cjs
          node scripts/test_intelligence.cjs
          node scripts/test_failure_states.cjs
          node scripts/test_charts.cjs
          node scripts/test_research.cjs
          node scripts/test_splits_ui.cjs
      - run: WEBKIT=1 node scripts/test_mobile.cjs
      - name: Publish through existing Pages builder and verify served assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_pages.py
