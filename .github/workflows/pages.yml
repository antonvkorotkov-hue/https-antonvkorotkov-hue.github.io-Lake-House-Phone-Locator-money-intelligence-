name: Verify and deploy Lake House Picks
on:
  push:
    branches: [main]
    paths: ['index.html', 'visual.js', 'visual.css', 'scoreboards.json', 'public-trades.json', 'scripts/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Refresh public sports trades']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false jsdom@26 playwright@1.61.1
      - run: npx playwright install --with-deps webkit
      - run: python scripts/test_collectors.py
      - run: node --check visual.js && node scripts/test_visual.cjs
      - run: WEBKIT=1 node scripts/test_mobile.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static files only
        run: |
          mkdir _site
          cp index.html visual.js visual.css public-trades.json scoreboards.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify served deployment assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PYCODE'
          import hashlib, os, time, urllib.request
          from pathlib import Path
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          for name in ['index.html', 'visual.js', 'visual.css', 'scoreboards.json', 'public-trades.json']:
              expected = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              for attempt in range(6):
                  with urllib.request.urlopen(base + name + '?verify=' + str(time.time_ns()), timeout=30) as response:
                      actual = hashlib.sha256(response.read()).hexdigest()
                  if actual == expected:
                      print('Verified served asset:', name)
                      break
                  if attempt == 5:
                      raise RuntimeError('Served asset differs from deployment: ' + name)
                  time.sleep(10)
          PYCODE
