name: Sites sportsbook invariants
on:
  push:
    branches: [feature/private-virtual-sportsbook, recovery/virtual-sportsbook-20261025]
    paths: ['sportsbook_sites/**', '.github/workflows/sites-sportsbook.yml']
  pull_request:
    paths: ['sportsbook_sites/**', '.github/workflows/sites-sportsbook.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-ledger.py
        working-directory: sportsbook_sites
      - run: node scripts/test-sportsbook.mjs
        working-directory: sportsbook_sites
      - run: node --check lib/sportsbook-feeds.mjs
        working-directory: sportsbook_sites
      - run: node --check public/sportsbook-assets/app.js
        working-directory: sportsbook_sites
      - run: node scripts/test-client-session.mjs
        working-directory: sportsbook_sites
      - run: node scripts/test-college.mjs
        working-directory: sportsbook_sites
      - run: node scripts/test-passwordless.mjs
        working-directory: sportsbook_sites
      - run: node scripts/test-market-view.mjs
        working-directory: sportsbook_sites
      - run: node scripts/test-espn-fallback.mjs
        working-directory: sportsbook_sites
      - run: node scripts/test-cashout.mjs
        working-directory: sportsbook_sites
      - run: node scripts/test-refill.mjs
        working-directory: sportsbook_sites
      - run: node scripts/test-line-movements.mjs
        working-directory: sportsbook_sites
